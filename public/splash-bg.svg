<svg viewBox="0 0 768 768" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield/Badge shape background -->
  <path d="M 200 150 L 568 150 L 568 450 Q 384 650 384 650 Q 200 450 200 450 Z" 
        fill="url(#shieldGradient)" 
        filter="url(#softGlow)"
        opacity="0.95"/>
  
  <!-- Left eye white circle -->
  <circle cx="305" cy="320" r="38" fill="#ffffff" opacity="0.95"/>
  
  <!-- Right eye white circle -->
  <circle cx="463" cy="320" r="38" fill="#ffffff" opacity="0.95"/>
  
  <!-- Left eye pupil -->
  <circle cx="310" cy="325" r="15" fill="#1e3a8a" opacity="0.7"/>
  
  <!-- Right eye pupil -->
  <circle cx="458" cy="325" r="15" fill="#1e3a8a" opacity="0.7"/>
  
  <!-- Smile arc (curve) -->
  <path d="M 310 420 Q 384 520 458 420" 
        stroke="#ffffff" 
        stroke-width="28" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.95"/>
</svg>